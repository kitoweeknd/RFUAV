train:  # train set path
val:  # valid set path
save_path:  # save model path
model: resnet152  # any timm.list_models() name (resnet50 / vit_base_patch16_224 / convnext_tiny / ...)
weights:  # fine-tune checkpoint path (leave empty to init from `pretrained`)
pretrained: True  # load ImageNet-pretrained backbone weights
batch_size: 8
image_size: 224  # single int (transforms.Resize uses (image_size, image_size)); ViT/Swin need a size the arch supports
lr: 0.0001
shuffle: True
num_classes: 23  # number of classes
class_names: [
    'yunzhuoT12',
    'Vbar',
    'Tarains_Plus_FLY',
    'RadioLinkAT9S',
    'Phantom4ProRTK',
    'Phantom4Pro',
    'Phantom3',
    'Mini3Pro',
    'Mini2',
    'MavicPro',
    'Mavic3',
    'Matrice600Pro',
    'Matrice300',
    'Matrice200',
    'Matrice100',
    'Matrice30T',
    'Inspire2',
    'FutabaT61Z',
    'FutabaT14SG',
    'FrskyX20',
    'DJi',
    'AVATA',
    'Air2S'
]  # class names
device: 'cuda' # device
num_epochs: 100