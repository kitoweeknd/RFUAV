[project]
name = "rfuav"
version = "0.1.0"
description = "RFUAV — RF-based UAV recognition: classification, detection, and signal/channel simulation toolkit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }

# Core runtime dependencies (mirrors requirements.txt). torch/torchvision/torchaudio
# are pulled from the CUDA 13.0 wheel index configured under [tool.uv.sources] below,
# which ships the CUDA-13 runtime and native sm_89 (RTX 40-series) kernels.
dependencies = [
    "numpy>=1.24.4",
    "opencv-python-headless>=4.9.0.80",
    "matplotlib>=3.9.2",
    "pillow>=10.4.0",
    "scipy>=1.13.1",
    "imageio>=2.36.0",
    "seaborn>=0.13.2",
    "pandas>=2.2.3",
    "colorama>=0.4.6",
    "psutil>=6.1.0",
    "pyyaml>=6.0.2",
    "six>=1.16.0",
    "tqdm>=4.67.1",
    "thop>=0.1.1.post2209072238",
    "requests>=2.28.0",
    "torch",
    "torchvision",
    "torchaudio",
    "albumentations>=1.4.20",
    "timm>=1.0.0",
]

[project.optional-dependencies]
# Object detection extras. YOLOv5 is vendored and Faster R-CNN comes from
# torchvision (core); only the RT-DETR backend needs transformers (lazy-imported).
detect = ["transformers>=4.45"]
# ChannelSimulation Qt viewer (GUI). Headless CI does not need this.
gui = ["PySide6>=6.5,<6.9", "pyqtgraph>=0.13"]
# Optional acceleration for the spectrum dB step (numpy fallback if absent).
accel = ["numexpr>=2.8"]

[dependency-groups]
dev = ["pytest>=7", "pytest-cov>=4"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
# This repository is run in place (scripts live at the repo root and are invoked
# as `uv run python train.py ...` against a mounted checkout), so it is NOT built
# or installed as a wheel. `package = false` makes `uv sync` install only the
# dependency set into the environment and skip building the project itself,
# which suits the mixed flat-module + package layout here.
[tool.uv]
package = false

# torch CUDA 13.0 wheels (bundled CUDA-13 runtime + native sm_89 kernels).
# cp312 wheels are published for linux x86_64.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -ra"
markers = [
    "gpu: requires a CUDA GPU (skipped when torch.cuda.is_available() is False)",
    "net: requires network access (model/weight downloads)",
    "ffmpeg: requires the ffmpeg binary on PATH",
    "slow: slow test (training / large forward); deselect with -m 'not slow'",
]
