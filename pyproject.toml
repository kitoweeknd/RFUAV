[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RFUAV-ChannelSimulation"
version = "1.3.0"
description = "Wireless channel impairment simulation pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ChannelSimulation*"]
