# ChannelSimulation Configuration Example (method + params multi-algorithm interface)
# Usage:
# python -m ChannelSimulation.channel_pipeline --config ChannelSimulation/channel_pipeline.sample.yaml

# -----------------------------
# Input Mode (choose one)
# -----------------------------
input: data/input.iq
# input_dir: data/iq_batch
input_glob: "*.iq"

# -----------------------------
# Basic Output Configuration
# -----------------------------
fs: 100000000
out_dir: ChannelSimulation/results
output_iq: ChannelSimulation/results/processed.iq
meta_json: ChannelSimulation/results/run_meta.json

# -----------------------------
# Pipeline Execution Control
# -----------------------------
stages: all
# Or as a list:
# stages: [original, fading, multipath, cfo, phase_noise, iq_imbalance, awgn, crop_time_shift]
show_progress: true

# -----------------------------
# Backward Compatibility with Legacy Parameters (optional)
# If both set, stage_configs takes precedence
# -----------------------------
fading: rayleigh
k_factor: 5.0
cfo_hz: 15000
phase_std: 0.002
iq_gain_db: 1.0
iq_phase_deg: 3.0
snr_db: 15.0
seed: 42

# -----------------------------
# New Unified Interface: stage_configs
# Each stage: method + params
# -----------------------------
stage_configs:
  fading:
    method: rayleigh  # rayleigh / rician
    params:
      k_factor: 5.0
      block_size: 256

  multipath:
    method: tdl
    params:
      max_delay_samp: 20
      n_paths: 4
      exp_decay: 0.35

  cfo:
    method: constant
    params:
      cfo_hz: 15000

  phase_noise:
    method: wiener
    params:
      phase_std_per_sample: 0.002

  iq_imbalance:
    method: widely_linear
    params:
      gain_imbalance_db: 1.0
      phase_imbalance_deg: 3.0

  awgn:
    method: gaussian
    params:
      snr_db: 15.0

  crop_time_shift:
    method: basic
    params:
      min_keep_ratio: 0.7
      max_shift: 300
