# ChannelSimulation Configuration Example (method + params multi-algorithm interface)
# Usage:
# python -m ChannelSimulation.channel_pipeline --config ChannelSimulation/channel_pipeline.sample.yaml

# -----------------------------
# Input Mode (choose one)
# -----------------------------
input: data/input.iq
# input_dir: data/iq_batch
input_glob: "*.iq"

# -----------------------------
# Basic Output Configuration
# -----------------------------
fs: 100000000
fc: 5.8e9
out_dir: ./results
output_iq: ./results/processed.iq
meta_json: ./results/run_meta.json

# -----------------------------
# Pipeline Execution Control
# -----------------------------
stages: all
# Or as a list:
# stages: [original, fading, doppler, multipath, cfo, phase_noise, iq_imbalance, awgn, crop_time_shift]
show_progress: true

# -----------------------------
# Backward Compatibility with Legacy Parameters (optional)
# If both set, stage_configs takes precedence
# -----------------------------
fading: rayleigh
k_factor: 5.0
cfo_hz: 15000
phase_std: 0.002
iq_gain_db: 1.0
iq_phase_deg: 3.0
snr_db: 15.0
seed: 42

# -----------------------------
# New Unified Interface: stage_configs
# Each stage: method + params + save
#
# save: (optional) if true, write intermediate IQ after this stage completes.
#       File path: <out_dir> / <stage_name>.iq
#       In streaming mode, enabling save for any stage forces full-signal
#       accumulation (higher memory usage for that stage only).
# -----------------------------
stage_configs:
  fading:
    method: rayleigh  # rayleigh / rician / rice_mild
    save: true
    params:
      k_factor: 5.0
      block_size: 256  # rice_mild uses 1024 by default

  doppler:
    method: jakes
    save: true
    params:
      doppler_shift_hz: 0.0     # mean Doppler shift (frequency offset)
      doppler_spread_hz: 100.0  # RMS width of the Doppler spectrum

  multipath:
    method: tdl
    save: true
    params:
      max_delay_samp: 20
      n_paths: 4
      exp_decay: 0.35

  cfo:
    method: constant
    save: true
    params:
      cfo_hz: 15000

  phase_noise:
    method: wiener
    save: true
    params:
      phase_std_per_sample: 0.002

  iq_imbalance:
    method: widely_linear
    save: true
    params:
      gain_imbalance_db: 1.0
      phase_imbalance_deg: 3.0

  awgn:
    method: gaussian
    save: true
    params:
      snr_db: 15.0

  crop_time_shift:
    method: basic
    save: true
    params:
      min_keep_ratio: 0.7
      max_shift: 300

# -----------------------------
# Memory Optimisation (streaming)
# -----------------------------
# Max complex samples held in RAM at once.  0 = always full-signal mode.
# Set to e.g. 10000000 to enable streaming for all files.
# chunk_size: 0

# Auto-switch to streaming when file > this many complex samples.
# chunk_limit: 20000000
