# ChannelSimulation Configuration Example (method + params multi-algorithm interface)
# Usage:
# python -m ChannelSimulation.channel_pipeline --config ChannelSimulation/channel_pipeline.sample.yaml

# -----------------------------
# Input Mode (choose one)
# -----------------------------
input: data/input.iq
# input_dir: data/iq_batch
input_glob: "*.iq"

# -----------------------------
# Basic Output Configuration
# -----------------------------
fs: 100000000
fc: 5.8e9
out_dir: ./results-crop_time_shift
output_iq: ./results-crop_time_shift/processed.iq
meta_json: ./results-crop_time_shift/run_meta.json

# -----------------------------
# Pipeline Execution Control
# -----------------------------
stages: [crop_time_shift]
# Or as a list:
# stages: [original, fading, multipath, cfo, phase_noise, iq_imbalance, awgn, crop_time_shift]
show_progress: true

# -----------------------------
# New Unified Interface: stage_configs
# Each stage: method + params + save
#
# save: (optional) if true, write intermediate IQ after this stage completes.
#       File path: <out_dir> / <stage_name>.iq
#       In streaming mode, enabling save for any stage forces full-signal
#       accumulation (higher memory usage for that stage only).
# -----------------------------
stage_configs:
  crop_time_shift:
    method: basic
    save: true
    params:
      min_keep_ratio: 0.7
      max_shift: 300

# -----------------------------
# Memory Optimisation (streaming)
# -----------------------------
# Max complex samples held in RAM at once.  0 = always full-signal mode.
# Set to e.g. 10000000 to enable streaming for all files.
# chunk_size: 0

# Auto-switch to streaming when file > this many complex samples.
# chunk_limit: 20000000
